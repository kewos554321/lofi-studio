name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # 測試只用到標準庫（不需 numpy / Google 套件 / ffmpeg）
      - name: compile
        run: python -m compileall -q src/lofi
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke (dry-run, no ComfyUI/ffmpeg)
        env:
          PYTHONPATH: src
          PYTHONPYCACHEPREFIX: /tmp/lofi-pyc
        run: |
          python -m lofi.cli config > /dev/null
          python -m lofi.cli visual --list > /dev/null
          printf 'id,style,mood,instruments,key,bpm,prompt,negative\n1,test,,,A minor,70,lofi rain,\n' > /tmp/smoke.csv
          python -m lofi.cli generate --dry-run --csv /tmp/smoke.csv
