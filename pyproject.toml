[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lofi-studio"
version = "0.1.0"
description = "本機 AI lofi 音樂／影片產線（Mac M4）"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
lofi = "lofi.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
